name: Build catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Test catalogue tooling
        run: python -m unittest discover -s tests

      - name: Build catalogue
        run: python tools/build_catalog.py

      - name: Validate generated snapshot
        run: python tools/validate_catalog.py --root dist/catalogue

      - name: Upload catalogue
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peachy-catalogue
          path: dist/catalogue/
          archive: true
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
